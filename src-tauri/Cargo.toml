[package]
name = "codex-shell"
version = "0.1.2"
description = "A focused desktop shell"
authors = ["CodexShell contributors"]
edition = "2021"

[lib]
name = "co_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.4"
